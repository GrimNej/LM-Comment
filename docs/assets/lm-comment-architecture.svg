<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LM-Comment architecture and privacy boundary</title>
  <desc id="desc">Android keeps the captured frame in memory and runs OCR locally. Only reviewed text and writing choices cross the HTTPS relay to the fixed Groq model. Editable replies return to the learner.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1280" y2="640">
      <stop stop-color="#F7F3EA"/><stop offset="1" stop-color="#EDE9DE"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#101411" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#101411" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4Z" fill="#101411"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Space Mono", Consolas, monospace; }
      .flow { stroke-dasharray: 7 8; animation: flow 11s linear infinite; }
      .phone-only { animation: breathe 4s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -150; } }
      @keyframes breathe { 50% { opacity: .68; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#paper)"/>
  <rect width="1280" height="640" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="638" rx="23" fill="none" stroke="#101411" stroke-opacity=".2" stroke-width="2"/>

  <g transform="translate(48 35)">
    <rect width="48" height="48" rx="14" fill="#101411"/>
    <g fill="none" stroke="#F4F0E6" stroke-linecap="round" stroke-width="3">
      <path d="M21 14H14v7"/><path d="M27 14h7v7"/>
      <path d="M21 34H14v-7"/><path d="M27 34h7v-7"/>
    </g>
    <circle cx="24" cy="24" r="4.5" fill="#B9E84A"/>
  </g>
  <text x="111" y="53" class="mono" fill="#646C63" font-size="9" letter-spacing="1.4">SYSTEM AT A GLANCE</text>
  <text x="111" y="79" class="sans" fill="#101411" font-size="26" font-weight="780" letter-spacing="-1">The screenshot stays on the phone. Reviewed text takes one narrow path.</text>

  <text x="48" y="131" class="mono" fill="#646C63" font-size="8" letter-spacing="1.3">01 / ANDROID DEVICE</text>
  <g filter="url(#shadow)">
    <g transform="translate(48 148)">
      <rect width="260" height="154" rx="16" fill="#101411" stroke="#101411" stroke-width="2"/>
      <circle cx="28" cy="29" r="10" fill="#B9E84A"/>
      <text x="48" y="32" class="mono" fill="#AEB4AA" font-size="7">SYSTEM OVERLAY</text>
      <text x="20" y="76" class="sans" fill="#F4F0E6" font-size="19" font-weight="780">Compact lens</text>
      <text x="20" y="104" class="sans" fill="#AEB4AA" font-size="10">User taps when context matters</text>
      <text x="20" y="124" class="sans" fill="#AEB4AA" font-size="10">No AccessibilityService</text>
    </g>
    <g transform="translate(334 148)">
      <rect width="260" height="154" rx="16" fill="#FFFFFF" stroke="#101411" stroke-width="2"/>
      <circle cx="28" cy="29" r="10" fill="#B9E84A" stroke="#101411"/>
      <text x="48" y="32" class="mono" fill="#646C63" font-size="7">ONE-SHOT CAPTURE</text>
      <text x="20" y="76" class="sans" fill="#101411" font-size="19" font-weight="780">Crop in memory</text>
      <text x="20" y="104" class="sans" fill="#646C63" font-size="10">One full-display frame</text>
      <text x="20" y="124" class="sans" fill="#646C63" font-size="10">Never written to storage</text>
    </g>
    <g transform="translate(620 148)">
      <rect width="260" height="154" rx="16" fill="#FFFFFF" stroke="#101411" stroke-width="2"/>
      <circle cx="28" cy="29" r="10" fill="#B9E84A" stroke="#101411"/>
      <text x="48" y="32" class="mono" fill="#646C63" font-size="7">BUNDLED ML KIT</text>
      <text x="20" y="76" class="sans" fill="#101411" font-size="19" font-weight="780">On-device OCR</text>
      <text x="20" y="104" class="sans" fill="#646C63" font-size="10">Learner checks every word</text>
      <text x="20" y="124" class="sans" fill="#646C63" font-size="10">Text remains editable</text>
    </g>
  </g>
  <path d="M308 225h20M594 225h20" fill="none" stroke="#101411" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="phone-only" x="48" y="329" width="832" height="58" rx="12" fill="#B9E84A" stroke="#101411" stroke-width="2"/>
  <text x="69" y="352" class="mono" fill="#101411" font-size="8" letter-spacing="1.1">PHONE-ONLY PIXEL BOUNDARY</text>
  <text x="69" y="374" class="sans" fill="#101411" font-size="12" font-weight="750">Captured pixels stop here. The relay never receives a screenshot.</text>
  <path d="M750 302v21" stroke="#101411" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="926" y="131" class="mono" fill="#646C63" font-size="8" letter-spacing="1.3">02 / MANAGED RELAY</text>
  <g filter="url(#shadow)">
    <g transform="translate(926 148)">
      <rect width="306" height="239" rx="16" fill="#101411" stroke="#101411" stroke-width="2"/>
      <circle cx="28" cy="29" r="10" fill="#E96D4C"/>
      <text x="48" y="32" class="mono" fill="#AEB4AA" font-size="7">HTTPS + FIXED MODEL</text>
      <text x="20" y="76" class="sans" fill="#F4F0E6" font-size="19" font-weight="780">Fastify relay</text>
      <text x="20" y="108" class="sans" fill="#AEB4AA" font-size="10">Reviewed text + tone + count</text>
      <text x="20" y="128" class="sans" fill="#AEB4AA" font-size="10">Validation + limits + timeouts</text>
      <path d="M20 151h266" stroke="#F4F0E6" stroke-opacity=".15"/>
      <text x="20" y="180" class="sans" fill="#F4F0E6" font-size="13" font-weight="720">Groq · openai/gpt-oss-120b</text>
      <text x="20" y="205" class="sans" fill="#AEB4AA" font-size="10">Provider key stays server-side</text>
      <text x="20" y="225" class="sans" fill="#AEB4AA" font-size="10">Structured replies return only</text>
    </g>
  </g>
  <path d="M880 358h40" fill="none" stroke="#101411" stroke-width="1.5" marker-end="url(#arrow)" class="flow"/>
  <text x="900" y="345" class="mono" fill="#646C63" font-size="7" text-anchor="middle">TEXT ONLY</text>

  <text x="48" y="439" class="mono" fill="#646C63" font-size="8" letter-spacing="1.3">03 / LEARNING LOOP</text>
  <g filter="url(#shadow)">
    <g transform="translate(48 456)">
      <rect width="280" height="116" rx="14" fill="#FFFFFF" stroke="#101411" stroke-width="2"/>
      <text x="20" y="31" class="mono" fill="#646C63" font-size="7">COMPARE</text>
      <text x="20" y="67" class="sans" fill="#101411" font-size="18" font-weight="780">Up to three examples</text>
      <text x="20" y="92" class="sans" fill="#646C63" font-size="10">Study tone, structure, and detail</text>
    </g>
    <g transform="translate(364 456)">
      <rect width="280" height="116" rx="14" fill="#FFFFFF" stroke="#101411" stroke-width="2"/>
      <text x="20" y="31" class="mono" fill="#646C63" font-size="7">REWRITE</text>
      <text x="20" y="67" class="sans" fill="#101411" font-size="18" font-weight="780">Fully editable words</text>
      <text x="20" y="92" class="sans" fill="#646C63" font-size="10">Keep, change, or replace the reply</text>
    </g>
    <g transform="translate(680 456)">
      <rect width="280" height="116" rx="14" fill="#FFFFFF" stroke="#101411" stroke-width="2"/>
      <text x="20" y="31" class="mono" fill="#646C63" font-size="7">DECIDE</text>
      <text x="20" y="67" class="sans" fill="#101411" font-size="18" font-weight="780">Explicit Copy action</text>
      <text x="20" y="92" class="sans" fill="#646C63" font-size="10">The learner chooses where to paste</text>
    </g>
    <g transform="translate(996 456)">
      <rect width="236" height="116" rx="14" fill="#E96D4C" stroke="#101411" stroke-width="2"/>
      <text x="20" y="31" class="mono" fill="#101411" font-size="7">NEVER AUTOMATIC</text>
      <text x="20" y="67" class="sans" fill="#101411" font-size="18" font-weight="820">No auto-posting</text>
      <text x="20" y="92" class="sans" fill="#101411" font-size="10" font-weight="650">Final authorship stays human</text>
    </g>
  </g>
  <path d="M328 514h30M644 514h30M960 514h30" fill="none" stroke="#101411" stroke-width="1.5" marker-end="url(#arrow)" class="flow"/>

  <g transform="translate(48 596)">
    <rect width="1184" height="26" rx="8" fill="#FFFFFF" stroke="#101411" stroke-opacity=".22"/>
    <text x="16" y="17" class="mono" fill="#646C63" font-size="7">INVARIANTS</text>
    <text x="105" y="17" class="sans" fill="#101411" font-size="9" font-weight="700">No screenshot persistence</text>
    <circle cx="282" cy="13" r="2.5" fill="#B9E84A"/>
    <text x="296" y="17" class="sans" fill="#101411" font-size="9" font-weight="700">No screenshot upload</text>
    <circle cx="455" cy="13" r="2.5" fill="#B9E84A"/>
    <text x="469" y="17" class="sans" fill="#101411" font-size="9" font-weight="700">No provider key in the APK</text>
    <circle cx="664" cy="13" r="2.5" fill="#B9E84A"/>
    <text x="678" y="17" class="sans" fill="#101411" font-size="9" font-weight="700">No accounts or database</text>
    <circle cx="855" cy="13" r="2.5" fill="#B9E84A"/>
    <text x="869" y="17" class="sans" fill="#101411" font-size="9" font-weight="700">No automatic posting</text>
  </g>
</svg>
